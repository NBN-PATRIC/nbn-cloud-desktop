# NBN Cloud: arquivos virtuais no macOS (extensão File Provider). Projeto gerado pelo XcodeGen:
#   xcodegen generate   (dentro desta pasta; o CI faz isso)
#
# Fase 1 (teste de viabilidade): a extensão usa o NextcloudFileProviderKit (LGPL-3.0-or-later) do
# nextcloud/desktop, baixado pelo CI num commit fixo em ../../../_externo/NextcloudFileProviderKit, e um app
# de teste registra o domínio e entrega a conta pelo canal XPC (ClientCommunicationProtocol).
# Sem conta de desenvolvedor da Apple: assinatura ad hoc ("-").
name: NBNCloudFileProvider
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  NextcloudFileProviderKit:
    path: ../../../_externo/NextcloudFileProviderKit
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # identidade: a do app de teste; o build do NBN Cloud passa NBN_FP_HOST_ID=<APPLICATION_REV_DOMAIN>
    # (a extensão precisa ter o identificador do app como prefixo)
    NBN_FP_HOST_ID: br.com.nbntelecom.cloud.fpteste
schemes:
  NBNCloudFPTeste:
    build:
      targets:
        NBNCloudFPTeste: all
  # só a extensão, para o build do NBN Cloud (shell_integration/MacOSX/CMakeLists.txt) embutir no app
  NBNCloudFileProviderExt:
    build:
      targets:
        NBNCloudFileProviderExt: all
targets:
  NBNCloudFileProviderExt:
    type: app-extension
    platform: macOS
    sources:
      - Ext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NBN_FP_HOST_ID).FileProviderExt
        PRODUCT_NAME: NBNCloudFileProviderExt
        INFOPLIST_FILE: Ext/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ext/FileProviderExt.entitlements
        OTHER_LDFLAGS: ["-ObjC"]
        # bibliotecas dinâmicas dos pacotes (RealmSwift) vão dentro da própria extensão
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
    dependencies:
      - package: NextcloudFileProviderKit
        product: NextcloudFileProviderKit
  NBNCloudFPTeste:
    type: application
    platform: macOS
    sources:
      - Teste
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NBN_FP_HOST_ID)
        PRODUCT_NAME: NBNCloudFPTeste
        INFOPLIST_FILE: Teste/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # As bibliotecas dinâmicas dos pacotes (RealmSwift) ficam em PackageFrameworks e a extensão as procura em
    # NBNCloudFPTeste.app/Contents/Frameworks (rpath @executable_path/../../../../Frameworks): copia e assina ad hoc.
    postBuildScripts:
      - name: Embutir as bibliotecas dinâmicas dos pacotes
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          for f in "$BUILT_PRODUCTS_DIR"/PackageFrameworks/*.framework; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            rm -rf "$DEST/$n"
            ditto "$f" "$DEST/$n"
            codesign --force --sign - "$DEST/$n"
            echo "embutido: $n"
          done
    dependencies:
      - target: NBNCloudFileProviderExt
        embed: true
      - package: NextcloudFileProviderKit
        product: NextcloudFileProviderXPC
