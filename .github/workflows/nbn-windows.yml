name: NBN Cloud - Windows

# Build do cliente desktop NBN Cloud (fork do ownCloud 6.0.x) para Windows x64.
# Mesmo pipeline do upstream (KDE Craft + cache de dependencias do ownCloud),
# reduzido ao Windows e sem SonarCloud.

on:
  push:
    branches:
      - 'nbn/**'
    tags:
      - 'nbn-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    permissions:
      contents: read
    name: windows-cl-x86_64
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-cl-msvc2022-x86_64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # lidos pela receita do Craft (owncloud-client.py) para achar o executável da marca
      APPLICATION_EXECUTABLE: nbncloud
      APPLICATION_SHORTNAME: NBNCloud
      NBN_BUILD: ${{ github.run_number }}

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: ~/cache
        key: ${{ runner.os }}-windows-cl-msvc2022-x86_64-6.0

    - name: Clone CraftMaster
      run: git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

    - name: Craft setup
      run: |
        New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup

    - name: Craft unshelve
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --unshelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

    - name: Prepare
      run: |
        New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set srcDir="${env:GITHUB_WORKSPACE}" owncloud/owncloud-client
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set buildNumber="${env:NBN_BUILD}" owncloud/owncloud-client

    - name: Install dependencies
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps owncloud/owncloud-client

    - name: Build
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache owncloud/owncloud-client

    - name: Package
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --package owncloud/owncloud-client

    - name: Prepare artifacts
      run: |
        Copy-Item "$env:HOME/craft/binaries/*" "${env:GITHUB_WORKSPACE}/binaries/" -ErrorAction SilentlyContinue
        Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/" | Format-Table Name, Length

    - name: MSI
      run: |
        python -m pip install --quiet pillow==11.3.0
        $pacote = Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/" -Include *.7z, *.zip -Recurse | Select-Object -First 1
        if (-not $pacote) { throw "pacote portátil do Craft não encontrado" }
        $dest = Join-Path $env:RUNNER_TEMP 'portatil'
        7z x $pacote.FullName "-o$dest" -y | Out-Null
        # o pacote pode vir com uma pasta raiz; acha onde está bin/nbncloud.exe
        $exe = Get-ChildItem $dest -Recurse -Filter nbncloud.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
        if (-not $exe) { throw "bin/nbncloud.exe não encontrado no pacote" }
        $raiz = $exe.Directory.Parent.FullName
        $versao = "6.0.3.${env:NBN_BUILD}"
        & "${env:GITHUB_WORKSPACE}/branding/windows/build-msi.ps1" -SourceDir $raiz -Version $versao -Out "${env:GITHUB_WORKSPACE}/binaries/"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nbn-cloud-windows-x64
        path: ${{ github.workspace }}/binaries/*
        retention-days: 30
