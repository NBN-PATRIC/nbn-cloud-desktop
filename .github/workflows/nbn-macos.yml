name: NBN Cloud - macOS

# Build do cliente desktop NBN Cloud (fork do ownCloud 6.0.x) para macOS.
# Mesmo pipeline do upstream (KDE Craft + cache de dependencias do ownCloud).
# Padrao: Intel (macos-64-clang no runner macos-15-intel), que roda em todo Mac (no Apple Silicon pelo Rosetta):
# os runners arm64 do GitHub ficaram sem capacidade em 25/11/2026. arm64 sob demanda (workflow_dispatch).
# Sem conta de desenvolvedor da Apple: o app sai com assinatura ad hoc ("-"), que o Apple Silicon exige para rodar.
# Na primeira abertura o usuario libera em Ajustes > Privacidade e Seguranca > "Abrir Mesmo Assim".

on:
  push:
    branches:
      - 'nbn/**'
    tags:
      - 'nbn-v*'
  workflow_dispatch:
    inputs:
      arquitetura:
        description: 'intel (macos-64-clang) ou arm64 (macos-clang-arm64)'
        type: choice
        options: [intel, arm64]
        default: intel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    permissions:
      contents: read
    name: macos-${{ inputs.arquitetura || 'intel' }}
    runs-on: ${{ (inputs.arquitetura || 'intel') == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    env:
      CRAFT_TARGET: ${{ (inputs.arquitetura || 'intel') == 'arm64' && 'macos-clang-arm64' || 'macos-64-clang' }}
      ARQ: ${{ (inputs.arquitetura || 'intel') == 'arm64' && 'arm64' || 'x86_64' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # lidos pela receita do Craft (owncloud-client.py) para achar o app da marca
      APPLICATION_EXECUTABLE: nbncloud
      APPLICATION_SHORTNAME: NBNCloud
      NBN_BUILD: ${{ github.run_number }}

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: ~/cache
        key: ${{ runner.os }}-${{ env.CRAFT_TARGET }}-6.0

    - name: Extensão File Provider (xcodegen e NextcloudFileProviderKit)
      # o CMake (shell_integration/MacOSX) compila a extensão e a põe no app se achar os dois
      shell: bash
      env:
        # nextcloud/desktop, commit de 25/11/2026 (NextcloudFileProviderKit, LGPL-3.0-or-later); o mesmo do
        # workflow nbn-macos-fileprovider.yml
        NC_DESKTOP_SHA: bad83ce9777529d133897c142e6974256572cdc0
      run: |
        set -euo pipefail
        brew install xcodegen
        mkdir -p _externo && cd _externo
        git init -q nc && cd nc
        git remote add origin https://github.com/nextcloud/desktop.git
        git sparse-checkout set shell_integration/MacOSX/NextcloudFileProviderKit
        git fetch -q --depth=1 origin "$NC_DESKTOP_SHA"
        git checkout -q FETCH_HEAD
        mv shell_integration/MacOSX/NextcloudFileProviderKit ../NextcloudFileProviderKit
        cd .. && rm -rf nc
        python3 ../shell_integration/MacOSX/NBNCloudFileProvider/patches/aplicar.py NextcloudFileProviderKit
        xcodebuild -version

    - name: Clone CraftMaster
      run: git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

    - name: Empacotador de Mac
      # o craft_override.ini do Windows pede o pacote portatil; no Mac o app so fica completo (Qt dentro do
      # bundle) pelo empacotador de DMG
      run: |
        $ini = "${env:GITHUB_WORKSPACE}/.github/workflows/craft_override.ini"
        (Get-Content $ini) -replace '^Packager/PackageType = .*', 'Packager/PackageType = MacDMGPackager' | Set-Content $ini
        Get-Content $ini

    - name: Craft setup
      run: |
        New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup

    - name: Craft unshelve
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --unshelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

    - name: Prepare
      run: |
        New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set srcDir="${env:GITHUB_WORKSPACE}" owncloud/owncloud-client
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set buildNumber="${env:NBN_BUILD}" owncloud/owncloud-client

    - name: Install dependencies
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps owncloud/owncloud-client

    - name: Build
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache owncloud/owncloud-client

    - name: Package
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --package owncloud/owncloud-client

    - name: DMG do NBN Cloud
      # pega o app do DMG do Craft, assina ad hoc (o Craft mexe nas bibliotecas depois de compilar, o que invalida a
      # assinatura do linker), confere e monta o DMG final com o atalho para Aplicativos
      shell: bash
      run: |
        set -euo pipefail
        ls -la "$HOME/craft/binaries/" || true
        DMG=$(ls "$HOME"/craft/binaries/*.dmg | head -1)
        MNT=$(mktemp -d)
        hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
        APP=$(find "$MNT" -maxdepth 2 -name "*.app" | head -1)
        echo "app no DMG do Craft: $APP"
        STAGE="$RUNNER_TEMP/dmg"
        rm -rf "$STAGE"; mkdir -p "$STAGE"
        ditto "$APP" "$STAGE/NBN Cloud.app"
        hdiutil detach "$MNT"
        xattr -cr "$STAGE/NBN Cloud.app"
        A="$STAGE/NBN Cloud.app"
        # --deep sozinho regrava as extensões SEM os direitos (sandbox): a extensão do Finder e a de arquivos
        # virtuais deixariam de carregar. Preserva os direitos e assina de novo a extensão File Provider com os dela.
        codesign --force --deep --preserve-metadata=entitlements,requirements,flags --sign - "$A"
        FP="$A/Contents/PlugIns/NBNCloudFileProviderExt.appex"
        if [ -d "$FP" ]; then
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/shell_integration/MacOSX/NBNCloudFileProvider/Ext/FileProviderExt.entitlements" "$FP"
          codesign --force --sign - --preserve-metadata=entitlements,requirements,flags "$A"
          echo "extensão File Provider no app:"; defaults read "$FP/Contents/Info" CFBundleIdentifier
          codesign -d --entitlements - "$FP" 2>/dev/null | grep -E "key|true" || true
          otool -L "$FP/Contents/MacOS/NBNCloudFileProviderExt" | grep -i realm || true
          ls "$A/Contents/Frameworks" | grep -i realm || echo "ATENÇÃO: RealmSwift.framework fora do app"
        else
          echo "ATENÇÃO: app sem a extensão File Provider (sem arquivos virtuais no macOS)"
        fi
        codesign -d --entitlements - "$A/Contents/PlugIns/FinderSyncExt.appex" 2>/dev/null | grep -E "key|true" || true
        codesign --verify --deep --strict --verbose=2 "$A"
        codesign -dv "$A" 2>&1 | grep -E "Identifier|Signature|Format"
        defaults read "$STAGE/NBN Cloud.app/Contents/Info" CFBundleIdentifier
        defaults read "$STAGE/NBN Cloud.app/Contents/Info" CFBundleShortVersionString
        ls "$STAGE/NBN Cloud.app/Contents/PlugIns" || true
        ln -s /Applications "$STAGE/Aplicativos"
        VER="6.0.3.${NBN_BUILD}"
        OUT="$GITHUB_WORKSPACE/binaries"
        hdiutil create -volname "NBN Cloud" -srcfolder "$STAGE" -ov -format UDZO "$OUT/NBNCloud-$VER-macos-$ARQ.dmg"
        cp "$OUT/NBNCloud-$VER-macos-$ARQ.dmg" "$OUT/NBN-Cloud-macOS.dmg"
        (cd "$OUT" && shasum -a 256 *.dmg | tee SHA256SUMS-macos.txt)

    - name: Upload artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: nbn-cloud-macos-${{ env.ARQ }}
        path: ${{ github.workspace }}/binaries/*
        retention-days: 30

    - name: Logs do Craft
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: craft-logs-macos
        path: |
          ~/craft/logs
          ~/craft/*/logs
        retention-days: 7
